<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobre con Carta</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #0a1e40, #163b70, #2a5da8);
    position: relative;
  }

  /* Fondo de estrellas */
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(white, transparent) 1px 1px;
    background-size: 3px 3px;
    opacity: 0.5;
    z-index: 1;
  }

  /* Luna */
  .moon {
    position: absolute;
    top: 50px;
    right: 40px;
    width: 70px;
    height: 70px;
    background: radial-gradient(circle at 30% 30%, #fff 60%, #ddd 100%);
    border-radius: 50%;
    box-shadow: 0 0 20px 5px #fff;
    z-index: 2;
  }

  /* Contenedor principal */
  .container {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Sobre cerrado */
  .envelope {
    position: relative;
    width: 220px;
    height: 150px;
    background: #c0392b;
    border-radius: 5px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    transition: transform 0.5s;
  }

  /* Tapa del sobre */
  .envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-bottom: 75px solid #e74c3c;
    transform-origin: top;
    transition: transform 0.6s ease;
  }

  /* Carta dentro */
  .letter {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    height: 180px;
    background: #fffaf0;
    padding: 15px;
    box-sizing: border-box;
    transition: top 0.8s ease;
    overflow: hidden;
  }

  .letter textarea {
    width: 100%;
    height: 100%;
    border: none;
    resize: none;
    outline: none;
    background: transparent;
    font-size: 14px;
  }

  /* Botón “Tócame” */
  .button {
    margin-top: 15px;
    background: #f39c12;
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
  }
  .button:hover {
    background: #e67e22;
  }

  /* Polaroids */
  .polaroids {
    position: absolute;
    top: 50%;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    transform: translateY(-50%);
    z-index: 0;
  }

  .polaroid {
    width: 80px;
    height: 100px;
    background: #fff;
    border: 2px solid #eee;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    cursor: pointer;
  }

  .polaroid input {
    display: none;
  }

  .polaroid img {
    width: 100%;
    height: 80%;
    object-fit: cover;
    border-bottom: 2px solid #ddd;
  }

  /* Animación abrir */
  .open .envelope::before {
    transform: rotateX(180deg);
  }
  .open .letter {
    top: -50px;
  }

  @media (max-width: 600px) {
    .envelope {
      width: 180px;
      height: 120px;
    }
    .polaroid {
      width: 70px;
      height: 90px;
    }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="moon"></div>

<div class="container">
  <div class="polaroids">
    <label class="polaroid">
      <input type="file" accept="image/*" onchange="previewImage(event, 0)">
      <img id="img0" src="" alt="+" />
    </label>
    <label class="polaroid">
      <input type="file" accept="image/*" onchange="previewImage(event, 1)">
      <img id="img1" src="" alt="+" />
    </label>
  </div>

  <div class="envelope" id="envelope"></div>

  <div class="letter" id="letter">
    <textarea placeholder="Escribe aquí tu mensaje..."></textarea>
  </div>

  <button class="button" id="btnAbrir">💌 Tócame</button>
</div>

<script>
  const envelope = document.getElementById('envelope');
  const letter = document.getElementById('letter');
  const button = document.getElementById('btnAbrir');
  const container = document.querySelector('.container');

  button.addEventListener('click', () => {
    container.classList.toggle('open');
  });

  function previewImage(event, index) {
    const img = document.getElementById('img' + index);
    img.src = URL.createObjectURL(event.target.files[0]);
  }
</script>

</body>
</html>
